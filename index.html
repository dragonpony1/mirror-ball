<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a0524">
<title>Mirror Ball</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mirror Ball">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<!-- ?v= must match VERSION in js/config.js. Without it a style-only change can
     sit behind a phone's cache for hours after the app itself has updated. -->
<link rel="stylesheet" href="css/style.css?v=1.3">
</head>
<body>

<!-- the ballroom: stage lights, a glitter haze, and a slow spotlight sweep -->
<div class="stage" aria-hidden="true">
  <div class="beam beam-a"></div>
  <div class="beam beam-b"></div>
  <div class="glitter" id="glitter"></div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<header>
  <div class="brand">
    <h1><span class="ball">🪩</span> <span class="wordmark" data-text="Mirror Ball">Mirror Ball</span></h1>
    <button id="share" class="sharebtn" aria-label="Share the league invite">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      Share</button>
  </div>
  <div class="whorow">
    <button id="who" hidden title="Switch league"></button>
    <button id="signout" hidden>Sign out</button>
  </div>
  <nav class="tabs" aria-label="Section">
    <button data-view="lineup" aria-pressed="true">My lineup</button>
    <button data-view="ballroom" aria-pressed="false">Ballroom</button>
    <button data-view="league" aria-pressed="false">League</button>
    <button data-view="rules" aria-pressed="false">Rules</button>
  </nav>
  <nav class="weeks" id="weeks" aria-label="Week"></nav>
</header>

<button id="ticker" class="ticker" hidden aria-label="Latest league chat message"><span id="tickertext"></span></button>

<main>
  <div class="topline"><span id="range"></span><span class="tz" id="tz"></span></div>
  <div id="updatebar" class="banner updatebar" role="status"></div>
  <div id="banner" class="banner" role="status"></div>
  <div id="content"></div>
</main>

<div id="sharemodal" class="modal" hidden>
  <div class="modalcard">
    <h2 id="modaltitle">Invite the family</h2>
    <img id="modalqr" src="qr.gif" alt="QR code that opens the league" class="qr">
    <p class="hint">Point a phone camera at it, or send the link by text.</p>
    <p class="code">Passcode: <b id="modalcode"></b></p>
    <button id="sendinvite">Send invite</button>
    <button id="a2hs" class="linkbtn">📲 Put this app on your home screen</button>
    <p id="a2hssteps" class="hint" hidden></p>
    <button id="closemodal" class="linkbtn">Close</button>
  </div>
</div>

<div id="commishmodal" class="modal" hidden>
  <div class="modalcard wide">
    <div id="commish"></div>
    <button id="closecommish" class="linkbtn">Close</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
